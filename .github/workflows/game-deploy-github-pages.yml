name: Deploy game (GitHub Pages)

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: game-deploy-github-pages
  cancel-in-progress: false

permissions: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download game build from release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release download \
            --repo "$GITHUB_REPOSITORY" \
            --pattern netris-web.zip \
            --dir .
          mkdir -p dist
          unzip -o netris-web.zip -d dist

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
