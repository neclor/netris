name: Build game (Web)

on:
  push:
    branches: [main]
    paths: [game/**]
  pull_request:
    paths: [game/**]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.0
          use-dotnet: false
          include-templates: true

      - name: Export web build
        working-directory: game
        run: |
          mkdir -p web
          godot --headless --export-release "Web" web/index.html
