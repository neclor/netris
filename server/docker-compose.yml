name: netris

services:
  netris-server:
    image: ghcr.io/neclor/netris/server:latest
    container_name: netris-server
    ports:
      - "${SERVER_PORT:-8080}:8080"
    volumes:
      - netris-data:/app/data

    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    restart: unless-stopped

volumes:
  netris-data:
